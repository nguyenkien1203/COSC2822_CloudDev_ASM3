spring:
  application:
    name: order-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1
        max-interval: 2000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: false
    redis:
      enabled: false

restaurant:
  security:
    endpoints:
      - path: /actuator/**
        type: PUBLIC
      - path: /health
        type: PUBLIC
      - path: /api/orders/guest/**
        type: PUBLIC

# Lambda Menu Service URL (API Gateway)
menu-service:
  url: ${MENU_SERVICE_URL:https://au1gqu8qxf.execute-api.us-east-1.amazonaws.com}

# Profile Service URL (ECS via ALB)  
profile-service:
  url: ${PROFILE_SERVICE_URL:http://localhost:8083}

# AWS Configuration
aws:
  region: ${AWS_REGION:us-east-1}

# Step Functions Discount Calculator
step-functions:
  discount-calculator-arn: ${STEP_FUNCTIONS_DISCOUNT_ARN:}
