name: Build and Push to ECR

on:
  push:
    branches: [build]
  workflow_dispatch:  # Manual trigger

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - auth-service
          - order-service
          - profile-service
          - reservation-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image with Spring Boot
        run: |
          ./gradlew :${{ matrix.service }}:bootBuildImage --no-daemon

      - name: Tag and push image to ECR
        run: |
          # Get the image name from bootBuildImage (it creates image:version format)
          IMAGE_NAME="${{ matrix.service }}"
          
          # Tag with latest and git SHA
          docker tag ${IMAGE_NAME}:latest ${{ env.ECR_REGISTRY }}/${IMAGE_NAME}:latest
          docker tag ${IMAGE_NAME}:latest ${{ env.ECR_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}
          
          # Push both tags
          docker push ${{ env.ECR_REGISTRY }}/${IMAGE_NAME}:latest
          docker push ${{ env.ECR_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}
          
          echo "Pushed ${IMAGE_NAME}:latest and ${IMAGE_NAME}:${{ github.sha }}"

  deploy-lambda:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Menu Service Lambda
        run: |
          cd lambda/menu-service
          zip -r menu-lambda.zip *.py
          aws lambda update-function-code \
            --function-name menu-service-lambda \
            --zip-file fileb://menu-lambda.zip \
            --region ${{ env.AWS_REGION }}

      - name: Deploy Discount Calculator Lambdas
        run: |
          cd lambda/discount-calculator
          
          # Package and deploy get_membership
          zip get_membership.zip get_membership.py
          aws lambda update-function-code \
            --function-name discount-get-membership \
            --zip-file fileb://get_membership.zip \
            --region ${{ env.AWS_REGION }} || echo "Lambda not deployed yet"
          
          # Package and deploy calculate_discount
          zip calculate_discount.zip calculate_discount.py
          aws lambda update-function-code \
            --function-name discount-calculate \
            --zip-file fileb://calculate_discount.zip \
            --region ${{ env.AWS_REGION }} || echo "Lambda not deployed yet"
