spring:
  application:
    name: profile-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1
        max-interval: 2000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: false
    redis:
      enabled: false

restaurant:
  security:
    endpoints:
      - path: /actuator/**
        type: PUBLIC
      - path: /health
        type: PUBLIC
