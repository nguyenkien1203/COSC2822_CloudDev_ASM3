AWSTemplateFormatVersion: '2010-09-09'
Description: 'Restaurant Microservices Services: ECS Services, Target Groups, API Gateway'

Parameters:
  InfraStackName:
    Type: String
    Description: Name of the infrastructure stack to import exports from
    Default: restaurant-infra-2
  EnvironmentName:
    Type: String
    Description: Environment name (e.g., dev, prod)
    Default: dev
  AuthServiceImage:
    Type: String
    Description: ECR URI for Auth Service
    Default: 616967801866.dkr.ecr.us-east-1.amazonaws.com/auth-service:v4
  MenuServiceImage:
    Type: String
    Description: ECR URI for Menu Service
  OrderServiceImage:
    Type: String
    Description: ECR URI for Order Service
  ProfileServiceImage:
    Type: String
    Description: ECR URI for Profile Service
  ReservationServiceImage:
    Type: String
    Description: ECR URI for Reservation Service
  DBPassword:
    Type: String
    Description: Database Password (must match infra stack)
    NoEcho: true
  LabRoleArn:
    Type: String
    Description: ARN of the LabRole (existing IAM role)

Resources:
  # -------------------------------------------------------------------------
  # Target Groups
  # -------------------------------------------------------------------------
  AuthTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub auth-tg-${EnvironmentName}
      VpcId: 
        Fn::ImportValue: !Sub "${InfraStackName}-VpcId"
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: '200'

  MenuTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub menu-tg-${EnvironmentName}
      VpcId: 
        Fn::ImportValue: !Sub "${InfraStackName}-VpcId"
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: '200'

  OrderTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub order-tg-${EnvironmentName}
      VpcId: 
        Fn::ImportValue: !Sub "${InfraStackName}-VpcId"
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: '200'

  ProfileTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub profile-tg-${EnvironmentName}
      VpcId: 
        Fn::ImportValue: !Sub "${InfraStackName}-VpcId"
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: '200'

  ReservationTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub reservation-tg-${EnvironmentName}
      VpcId: 
        Fn::ImportValue: !Sub "${InfraStackName}-VpcId"
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: '200'

  # -------------------------------------------------------------------------
  # ALB Listener Rules
  # -------------------------------------------------------------------------
  AuthListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: 
        Fn::ImportValue: !Sub "${InfraStackName}-HTTPListenerArn"
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/auth/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AuthTG

  MenuListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: 
        Fn::ImportValue: !Sub "${InfraStackName}-HTTPListenerArn"
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/v1/menu/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref MenuTG

  OrderListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: 
        Fn::ImportValue: !Sub "${InfraStackName}-HTTPListenerArn"
      Priority: 30
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/v1/orders/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref OrderTG

  ProfileListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: 
        Fn::ImportValue: !Sub "${InfraStackName}-HTTPListenerArn"
      Priority: 40
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/v1/profiles/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ProfileTG

  ReservationListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: 
        Fn::ImportValue: !Sub "${InfraStackName}-HTTPListenerArn"
      Priority: 50
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/v1/reservations/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ReservationTG

  # -------------------------------------------------------------------------
  # ECS Task Definitions
  # -------------------------------------------------------------------------

  AuthTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: auth-service
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref LabRoleArn
      TaskRoleArn: !Ref LabRoleArn
      ContainerDefinitions:
        - Name: auth-service
          Image: !Ref AuthServiceImage
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/restaurant-app
              awslogs-region: !Ref "AWS::Region"
              awslogs-create-group: "true"
              awslogs-stream-prefix: auth
          Environment:
            - Name: SPRING_CLOUD_CONFIG_ENABLED
              Value: "false"
            - Name: SPRING_CONFIG_IMPORT
              Value: "optional:configserver:"
            - Name: SPRING_DATASOURCE_URL
              Value: !Join ["", ["jdbc:postgresql://", !ImportValue {"Fn::Sub": "${InfraStackName}-RDSEndpoint"}, ":5432/restaurant_db"]]
            - Name: SPRING_DATASOURCE_USERNAME
              Value: postgres
            - Name: SPRING_DATASOURCE_PASSWORD
              Value: !Ref DBPassword
            - Name: SPRING_DATA_REDIS_HOST
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-RedisEndpoint"}
            - Name: SPRING_DATA_REDIS_STANDALONE_HOST
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-RedisEndpoint"}
            - Name: SPRING_DATA_REDIS_PORT
              Value: "6379"
            - Name: SPRING_DATA_REDIS_STANDALONE_PORT
              Value: "6379"
            - Name: SERVER_PORT
              Value: "8080"
            - Name: RESTAURANT_SECURITY_COGNITO_USER_POOL_ID
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-UserPoolId"}
            - Name: RESTAURANT_SECURITY_COGNITO_REGION
              Value: !Ref "AWS::Region"
            - Name: RESTAURANT_SECURITY_COGNITO_CLIENT_ID
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-UserPoolClientId"}
            - Name: AWS_COGNITO_REGION
              Value: !Ref "AWS::Region"
            - Name: AWS_COGNITO_USER_POOL_ID
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-UserPoolId"}
            - Name: AWS_COGNITO_CLIENT_ID
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-UserPoolClientId"}
            - Name: EUREKA_CLIENT_ENABLED
              Value: "false"
            - Name: SPRING_CLOUD_DISCOVERY_ENABLED
              Value: "false"
            - Name: SPRING_REDIS_HOST
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-RedisEndpoint"}
            - Name: SPRING_REDIS_PORT
              Value: "6379"

  MenuTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: menu-service
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref LabRoleArn
      TaskRoleArn: !Ref LabRoleArn
      ContainerDefinitions:
        - Name: menu-service
          Image: !Ref MenuServiceImage
          PortMappings:
            - ContainerPort: 8080
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/restaurant-app
              awslogs-region: !Ref "AWS::Region"
              awslogs-create-group: "true"
              awslogs-stream-prefix: menu
          Environment:
            - Name: SPRING_CLOUD_CONFIG_ENABLED
              Value: "false"
            - Name: SPRING_CONFIG_IMPORT
              Value: "optional:configserver:"
            - Name: SPRING_DATASOURCE_URL
              Value: !Join ["", ["jdbc:postgresql://", !ImportValue {"Fn::Sub": "${InfraStackName}-RDSEndpoint"}, ":5432/restaurant_db"]]
            - Name: SPRING_DATASOURCE_USERNAME
              Value: postgres
            - Name: SPRING_DATASOURCE_PASSWORD
              Value: !Ref DBPassword
            - Name: SPRING_DATA_REDIS_HOST
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-RedisEndpoint"}
            - Name: SERVER_PORT
              Value: "8080"
            - Name: RESTAURANT_SECURITY_COGNITO_USER_POOL_ID
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-UserPoolId"}
            - Name: RESTAURANT_SECURITY_COGNITO_REGION
              Value: !Ref "AWS::Region"

  OrderTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: order-service
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref LabRoleArn
      TaskRoleArn: !Ref LabRoleArn
      ContainerDefinitions:
        - Name: order-service
          Image: !Ref OrderServiceImage
          PortMappings:
            - ContainerPort: 8080
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/restaurant-app
              awslogs-region: !Ref "AWS::Region"
              awslogs-create-group: "true"
              awslogs-stream-prefix: order
          Environment:
            - Name: SPRING_CLOUD_CONFIG_ENABLED
              Value: "false"
            - Name: SPRING_CONFIG_IMPORT
              Value: "optional:configserver:"
            - Name: SPRING_DATASOURCE_URL
              Value: !Join ["", ["jdbc:postgresql://", !ImportValue {"Fn::Sub": "${InfraStackName}-RDSEndpoint"}, ":5432/restaurant_db"]]
            - Name: SPRING_DATASOURCE_USERNAME
              Value: postgres
            - Name: SPRING_DATASOURCE_PASSWORD
              Value: !Ref DBPassword
            - Name: SPRING_DATA_REDIS_HOST
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-RedisEndpoint"}
            - Name: SERVER_PORT
              Value: "8080"
            - Name: RESTAURANT_SECURITY_COGNITO_USER_POOL_ID
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-UserPoolId"}
            - Name: RESTAURANT_SECURITY_COGNITO_REGION
              Value: !Ref "AWS::Region"

  ProfileTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: profile-service
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref LabRoleArn
      TaskRoleArn: !Ref LabRoleArn
      ContainerDefinitions:
        - Name: profile-service
          Image: !Ref ProfileServiceImage
          PortMappings:
            - ContainerPort: 8080
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/restaurant-app
              awslogs-region: !Ref "AWS::Region"
              awslogs-create-group: "true"
              awslogs-stream-prefix: profile
          Environment:
            - Name: SPRING_CLOUD_CONFIG_ENABLED
              Value: "false"
            - Name: SPRING_CONFIG_IMPORT
              Value: "optional:configserver:"
            - Name: SPRING_DATASOURCE_URL
              Value: !Join ["", ["jdbc:postgresql://", !ImportValue {"Fn::Sub": "${InfraStackName}-RDSEndpoint"}, ":5432/restaurant_db"]]
            - Name: SPRING_DATASOURCE_USERNAME
              Value: postgres
            - Name: SPRING_DATASOURCE_PASSWORD
              Value: !Ref DBPassword
            - Name: SPRING_DATA_REDIS_HOST
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-RedisEndpoint"}
            - Name: SERVER_PORT
              Value: "8080"
            - Name: RESTAURANT_SECURITY_COGNITO_USER_POOL_ID
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-UserPoolId"}
            - Name: RESTAURANT_SECURITY_COGNITO_REGION
              Value: !Ref "AWS::Region"

  ReservationTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: reservation-service
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref LabRoleArn
      TaskRoleArn: !Ref LabRoleArn
      ContainerDefinitions:
        - Name: reservation-service
          Image: !Ref ReservationServiceImage
          PortMappings:
            - ContainerPort: 8080
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/restaurant-app
              awslogs-region: !Ref "AWS::Region"
              awslogs-create-group: "true"
              awslogs-stream-prefix: reservation
          Environment:
            - Name: SPRING_CLOUD_CONFIG_ENABLED
              Value: "false"
            - Name: SPRING_CONFIG_IMPORT
              Value: "optional:configserver:"
            - Name: SPRING_DATASOURCE_URL
              Value: !Join ["", ["jdbc:postgresql://", !ImportValue {"Fn::Sub": "${InfraStackName}-RDSEndpoint"}, ":5432/restaurant_db"]]
            - Name: SPRING_DATASOURCE_USERNAME
              Value: postgres
            - Name: SPRING_DATASOURCE_PASSWORD
              Value: !Ref DBPassword
            - Name: SPRING_DATA_REDIS_HOST
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-RedisEndpoint"}
            - Name: SERVER_PORT
              Value: "8080"
            - Name: RESTAURANT_SECURITY_COGNITO_USER_POOL_ID
              Value: !ImportValue {"Fn::Sub": "${InfraStackName}-UserPoolId"}
            - Name: RESTAURANT_SECURITY_COGNITO_REGION
              Value: !Ref "AWS::Region"

  # -------------------------------------------------------------------------
  # ECS Services
  # -------------------------------------------------------------------------
  AuthService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: 
        Fn::ImportValue: !Sub "${InfraStackName}-ClusterName"
      ServiceName: auth-service
      TaskDefinition: !Ref AuthTaskDef
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - Fn::ImportValue: !Sub "${InfraStackName}-PrivateSubnet1"
            - Fn::ImportValue: !Sub "${InfraStackName}-PrivateSubnet2"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${InfraStackName}-ECSHostSecurityGroup"
      LoadBalancers:
        - ContainerName: auth-service
          ContainerPort: 8080
          TargetGroupArn: !Ref AuthTG

  MenuService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: 
        Fn::ImportValue: !Sub "${InfraStackName}-ClusterName"
      ServiceName: menu-service
      TaskDefinition: !Ref MenuTaskDef
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - Fn::ImportValue: !Sub "${InfraStackName}-PrivateSubnet1"
            - Fn::ImportValue: !Sub "${InfraStackName}-PrivateSubnet2"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${InfraStackName}-ECSHostSecurityGroup"
      LoadBalancers:
        - ContainerName: menu-service
          ContainerPort: 8080
          TargetGroupArn: !Ref MenuTG

  OrderService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: 
        Fn::ImportValue: !Sub "${InfraStackName}-ClusterName"
      ServiceName: order-service
      TaskDefinition: !Ref OrderTaskDef
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - Fn::ImportValue: !Sub "${InfraStackName}-PrivateSubnet1"
            - Fn::ImportValue: !Sub "${InfraStackName}-PrivateSubnet2"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${InfraStackName}-ECSHostSecurityGroup"
      LoadBalancers:
        - ContainerName: order-service
          ContainerPort: 8080
          TargetGroupArn: !Ref OrderTG

  ProfileService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: 
        Fn::ImportValue: !Sub "${InfraStackName}-ClusterName"
      ServiceName: profile-service
      TaskDefinition: !Ref ProfileTaskDef
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - Fn::ImportValue: !Sub "${InfraStackName}-PrivateSubnet1"
            - Fn::ImportValue: !Sub "${InfraStackName}-PrivateSubnet2"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${InfraStackName}-ECSHostSecurityGroup"
      LoadBalancers:
        - ContainerName: profile-service
          ContainerPort: 8080
          TargetGroupArn: !Ref ProfileTG

  ReservationService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: 
        Fn::ImportValue: !Sub "${InfraStackName}-ClusterName"
      ServiceName: reservation-service
      TaskDefinition: !Ref ReservationTaskDef
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - Fn::ImportValue: !Sub "${InfraStackName}-PrivateSubnet1"
            - Fn::ImportValue: !Sub "${InfraStackName}-PrivateSubnet2"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${InfraStackName}-ECSHostSecurityGroup"
      LoadBalancers:
        - ContainerName: reservation-service
          ContainerPort: 8080
          TargetGroupArn: !Ref ReservationTG

Outputs:
  ApiEndpoint:
    Description: Load Balancer DNS
    Value: 
      Fn::ImportValue: !Sub "${InfraStackName}-LoadBalancerDNS"
