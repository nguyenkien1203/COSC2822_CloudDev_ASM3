spring:
  application:
    name: auth-service

  # PostgreSQL Configuration for Auth Service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_service_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  # Kafka Configuration for Auth Service (Producer)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auth-service-group
      auto-offset-reset: earliest
      enable-auto-commit: true
      auto-commit-interval: 1000
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 1
      buffer-memory: 33554432

server:
  port: 8081

# AWS Cognito Configuration
aws:
  cognito:
    region: ${AWS_COGNITO_REGION:ap-southeast-1}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
    client-id: ${AWS_COGNITO_CLIENT_ID:}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}

# JWT/Cookie Configuration (used for storing Cognito tokens in cookies)
jwt:
  cookie-name: auth_token
  refresh-cookie-name: refresh_auth_token
  expiration-days: 1  # Access token cookie (short-lived, Cognito tokens expire in 1 hour by default)
  refresh-expiration-days: 30

# Additional logging for Auth Service
logging:
  level:
    org.springframework.security: DEBUG
    com.restaurant.authservice: DEBUG
    software.amazon.awssdk: INFO
