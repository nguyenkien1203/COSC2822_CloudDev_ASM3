spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        
        - id: menu-service
          uri: lb://menu-service
          predicates:
            - Path=/api/menu/**
            
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
            
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/api/profiles/**
            
        - id: reservation-service
          uri: lb://reservation-service
          predicates:
            - Path=/api/reservations/**
            
        - id: table-service
          uri: lb://reservation-service
          predicates:
            - Path=/api/tables/**
            
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://restaurant-alb-696207792.us-east-1.elb.amazonaws.com"
              - "https://nvkncf9aa6.execute-api.us-east-1.amazonaws.com"
              - "http://restaurant-frontend-prod.eba-b5xcwdc4.us-east-1.elasticbeanstalk.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allow-credentials: true

  # Kafka Consumer Group for API Gateway
  kafka:
    consumer:
      group-id: api-gateway-group

server:
  port: 8080

# Additional logging for API Gateway
logging:
  level:
    org.springframework.cloud.gateway: DEBUG

jwt:
  sig:
    public-key: ${JWT_SIG_PUBLIC_KEY:}
  # Encryption private key for JWE decryption
  enc:
    private-key: ${JWT_ENC_PRIVATE_KEY:}

  # Cookie configuration
  cookie-name: auth_token              # Access token cookie
  refresh-cookie-name: refresh_auth_token   # Refresh token cookie

  # Public paths (no authentication required)
  public-paths:
    - /api/auth/**        # Includes login, register, refresh, logout
    - /actuator/health
    - /actuator/info
